name: Packet Probe
on:
  push:
    branches: [probe/midv-packets]
jobs:
  probe:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe-out
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 -dynamiclib tests/packet-scan.c -o probe-out/packet_scan.dylib -Wl,-install_name,@rpath/packet_scan.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: packet-scan
          path: probe-out
