name: Build PyVideo Plus arm64e
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test original and enhanced collectors
        run: node tests/collector.cjs
      - name: Run local HTTP, ImageIO and real FFmpeg media smoke tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then brew install ffmpeg; fi
          python3 tests/media-pipeline-local.py
          python3 tests/media-metadata-regression.py
          python3 tests/ui-list-regression.py
      - name: Test HLS manifest parser
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I storage tests/hls-manifest-test.m storage/PVXHLSManifest.m -framework Foundation -o "$RUNNER_TEMP/pvx-hls-test"
          "$RUNNER_TEMP/pvx-hls-test"
      - name: Execute production HLS localizer tests
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -I storage tests/hls-localizer-test.m storage/PVXHLSLocalizer.m storage/PVXHLSManifest.m -framework Foundation -o "$RUNNER_TEMP/pvx-localizer-test"
          "$RUNNER_TEMP/pvx-localizer-test"
      - name: Decode six actual HLS fixtures after production localization
        if: ${{ !cancelled() }}
        run: sh tests/hls-e2e-check.sh
      - name: Execute native ABI adapter tests
        if: ${{ !cancelled() }}
        run: sh tests/native-remux-check.sh
      - name: Decode actual MP4 samples using production validator
        if: ${{ !cancelled() }}
        run: sh tests/media-validator-check.sh
      - name: Test production recovery cancellation retry and atomic publication
        if: ${{ !cancelled() }}
        run: sh tests/recovery-state-check.sh
      - name: Build true arm64e using Apple compiler and linker
        if: ${{ !cancelled() }}
        run: python3 build-macos.py
      - name: Test storage hooks and disk retention
        if: ${{ !cancelled() }}
        run: sh tests/storage-beta2/check.sh
      - name: Test production metadata and file actions
        run: sh tests/export-beta3-check.sh
      - name: Run real WebKit collection and production UIKit flows
        run: python3 tests/webkit-beta3-simulator.py
      - name: Compile isolated original-Agent device trial
        if: ${{ !cancelled() }}
        run: |
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 -dynamiclib -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -Istorage tests/device-native-trial.m storage/PVXHLSLocalizer.m storage/PVXHLSManifest.m storage/PVXLibavInput.m storage/PVXNativeRemux.m storage/PVXMediaValidator.m -framework Foundation -framework AVFoundation -framework CoreMedia -framework CoreVideo -framework CoreGraphics -install_name @rpath/PVXNativeTrial.dylib -o build/PVXNativeTrial.dylib
          codesign --force --sign - build/PVXNativeTrial.dylib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyvideo-plus-arm64e
          path: |
            build/PyVideoPlus.dylib
            build/PyVideoPhotoWorker
            build/PyVideoStorage.dylib
            build/cloud-build.json
            build/PVXNativeTrial.dylib
            tests/webkit-beta3-output/**/*.txt
            tests/webkit-beta3-output/**/artifacts.json
            tests/webkit-beta3-output/**/*.png
            tests/webkit-beta3-output/**/source-sha256.json
            tests/webkit-beta3-output/**/*.log
            tests/webkit-beta3-output/**/webkit-beta3-result.txt
            evidence/collector-tests.json
          if-no-files-found: error
