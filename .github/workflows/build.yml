name: Build PyVideo Plus arm64e
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Test original and enhanced collectors
        run: |
          node tests/collector.cjs
          node tests/source-collector.cjs
      - name: Test native magnet parsing, queue writes and package contract
        run: |
          sh tests/magnet-normalizer-check.sh
          python3 tests/package-contract.py -v
          sh tests/torrent-worker-runtime-check.sh
      - name: Install build and media test dependencies
        run: brew install autoconf automake libtool pkg-config gettext ffmpeg aria2 ripgrep
      - name: Build static aria2 BitTorrent engine
        if: ${{ !cancelled() }}
        run: |
          python3 tests/torrent-worker-contract.py
          sh tools/build-aria2-ios.sh
      - name: Run local HTTP, ImageIO and real FFmpeg media smoke tests
        run: |
          python3 tests/media-pipeline-local.py
          python3 tests/media-metadata-regression.py
          python3 tests/ui-list-regression.py
      - name: Test HLS manifest parser
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fblocks -Wall -Wextra -Werror -I storage tests/hls-manifest-test.m storage/PVXHLSManifest.m -framework Foundation -o "$RUNNER_TEMP/pvx-hls-test"
          "$RUNNER_TEMP/pvx-hls-test"
      - name: Execute production HLS localizer tests
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -I storage tests/hls-localizer-test.m storage/PVXHLSLocalizer.m storage/PVXHLSManifest.m -framework Foundation -o "$RUNNER_TEMP/pvx-localizer-test"
          "$RUNNER_TEMP/pvx-localizer-test"
      - name: Decode six actual HLS fixtures after production localization
        if: ${{ !cancelled() }}
        run: sh tests/hls-e2e-check.sh
      - name: Execute production libav TS input and nonce cleanup regressions
        if: ${{ !cancelled() }}
        env:
          PVX_LIBAV_INPUT_WORK: ${{ runner.temp }}/pvx libav input regression
        run: sh tests/libav-input-check.sh
      - name: Upload production libav input regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libav-input-regression
          path: ${{ runner.temp }}/pvx libav input regression
          if-no-files-found: warn
      - name: Execute native ABI adapter tests
        if: ${{ !cancelled() }}
        run: sh tests/native-remux-check.sh
      - name: Decode actual MP4 samples using production validator
        if: ${{ !cancelled() }}
        run: sh tests/media-validator-check.sh
      - name: Test production recovery cancellation retry and atomic publication
        if: ${{ !cancelled() }}
        run: sh tests/recovery-state-check.sh
      - name: Build true arm64e using Apple compiler and linker
        if: ${{ !cancelled() }}
        run: python3 build-macos.py
      - name: Test storage hooks and disk retention
        if: ${{ !cancelled() }}
        run: sh tests/storage-beta2/check.sh
      - name: Test production metadata and file actions
        run: sh tests/export-beta3-check.sh
      - name: Execute real private Torrent swarm and worker controls
        run: |
          xcrun --sdk macosx clang++ -std=c++17 -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -Wno-deprecated-declarations -Isrc btworker/main.mm -framework Foundation -framework AVFoundation -framework CoreMedia -o "$RUNNER_TEMP/PyVideoBTWorker.host"
          ffmpeg -y -loglevel error -f lavfi -i color=c=black:s=64x64:d=1 -c:v libx264 -pix_fmt yuv420p -movflags +faststart "$RUNNER_TEMP/torrent-fixture.mp4"
          python3 tests/torrent-device-e2e.py --worker "$RUNNER_TEMP/PyVideoBTWorker.host" --engine "$(command -v aria2c)" --mp4 "$RUNNER_TEMP/torrent-fixture.mp4" --root "$RUNNER_TEMP/pvx-bt-e2e"
      - name: Upload private Torrent regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: torrent-runtime-regression
          path: |
            ${{ runner.temp }}/pvx-bt-e2e/*.json
            ${{ runner.temp }}/pvx-bt-e2e/*.log
            ${{ runner.temp }}/pvx-bt-e2e/fixture/fixture.json
          if-no-files-found: warn
      - name: Run real WebKit collection and production UIKit flows
        if: ${{ !cancelled() }}
        run: python3 tests/webkit-beta3-simulator.py
      - name: Compile isolated original-Agent device trial
        if: ${{ !cancelled() }}
        run: |
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 -dynamiclib -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -Istorage tests/device-native-trial.m storage/PVXHLSLocalizer.m storage/PVXHLSManifest.m storage/PVXLibavInput.m storage/PVXNativeRemux.m storage/PVXMediaValidator.m -framework Foundation -framework AVFoundation -framework CoreMedia -framework CoreVideo -framework CoreGraphics -install_name @rpath/PVXNativeTrial.dylib -o build/PVXNativeTrial.dylib
          codesign --force --sign - build/PVXNativeTrial.dylib
      - name: Compile isolated on-device player watchdog probe
        if: ${{ !cancelled() }}
        run: |
          mkdir -p build/PVXPlayerTrial.app
          cp tests/device-player-trial-Info.plist build/PVXPlayerTrial.app/Info.plist
          xcrun --sdk iphoneos clang -target arm64e-apple-ios15.0 -fobjc-arc -fblocks -Wall -Wextra -Werror -Wno-unused-parameter -Isrc tests/device-player-trial.m -o build/PVXPlayerTrial.app/PVXPlayerTrial -framework Foundation -framework UIKit -framework WebKit -framework AVFoundation -framework AVFAudio -framework AVKit -framework CoreMedia -framework CoreVideo -framework CoreGraphics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pyvideo-plus-arm64e
          path: |
            build/PyVideoPlus.dylib
            build/PyVideoPhotoWorker
            build/PyVideoBTWorker
            build/PyVideoAria2c
            build/PyVideoStorage.dylib
            build/cloud-build.json
            build/third-party/aria2/provenance.json
            build/third-party/aria2/aria2-source.tar.gz
            build/third-party/aria2/build-aria2-ios.sh
            build/third-party/aria2/aria2-file.txt
            build/third-party/aria2/aria2-dependencies.txt
            build/third-party/aria2/COPYING
            build/third-party/aria2/COPYRIGHT
            build/third-party/aria2/AUTHORS
            build/third-party/aria2/LICENSE.OpenSSL
            build/third-party/aria2/NOTICE
            build/PVXNativeTrial.dylib
            build/PVXPlayerTrial.app/PVXPlayerTrial
            build/PVXPlayerTrial.app/Info.plist
            tests/webkit-beta3-output/**/*.txt
            tests/webkit-beta3-output/**/artifacts.json
            tests/webkit-beta3-output/**/*.png
            tests/webkit-beta3-output/**/source-sha256.json
            tests/webkit-beta3-output/**/*.log
            tests/webkit-beta3-output/**/webkit-beta3-result.txt
            evidence/collector-tests.json
          if-no-files-found: error
